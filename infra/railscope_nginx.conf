# ==============================================================================
# RailScope - Nginx Reverse Proxy Configuration
# Exposes internal FastAPI service (127.0.0.1:8000) with full WebSocket support
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream railscope_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.railscope.eu localhost 127.0.0.1;

    # Tamaño máximo de carga para lotes masivos de telemetría
    client_max_body_size 25M;

    # Cabeceras de seguridad recomendadas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs de acceso y error
    access_log /var/log/nginx/railscope_access.log combined;
    error_log /var/log/nginx/railscope_error.log warn;

    # --------------------------------------------------------------------------
    # 1. Canal WebSocket de Telemetría en Tiempo Real (/ws/)
    # --------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://railscope_backend;
        proxy_http_version 1.1;

        # Cabeceras obligatorias para el handshake y persistencia de WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Preservar identidad y metadatos de la conexión cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evitar desconexiones de sockets por timeouts agresivos
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Desactivar buffering para transmisión de latencia cero
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 2. Endpoints REST de la API FastAPI y Healthcheck (/api/, /healthz)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://railscope_backend;
        proxy_http_version 1.1;

        # Soporte preventivo para actualización a WebSocket en cualquier ruta
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

